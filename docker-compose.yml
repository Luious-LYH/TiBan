services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: endotutor_stage1
      POSTGRES_USER: endotutor_dev
      POSTGRES_PASSWORD: endotutor_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - endotutor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endotutor_dev -d endotutor_stage1"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - endotutor_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - endotutor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      ENDO_APP_ENV: demo
      ENDO_DEMO_QBANK_BOOTSTRAP: "false"
      ENDO_PROJECT_DATA_ROOT: /app/data
      ENDO_LOCAL_VQA_ROOT: /app/vqa-data
      ENDO_EMBEDDING_CACHE: /app/runtime/fastembed
      ENDO_KNOWLEDGE_UPLOAD_DIR: /app/runtime/knowledge
      ENDO_DATABASE_URL: postgresql+psycopg://endotutor_dev:endotutor_dev_only@postgres:5432/endotutor_stage1
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      ENDO_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Read local provider configuration from the ignored root .env without
      # baking a gateway address or credential into the compose file.
      LLM_PROVIDER: ${LLM_PROVIDER:-cloudflare_workers_ai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-@cf/qwen/qwen3-30b-a3b-fp8}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openrouter}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-minimax/minimax-m3:free}
      LLM_FINAL_FALLBACK_PROVIDER: ${LLM_FINAL_FALLBACK_PROVIDER:-bigmodel}
      LLM_FINAL_FALLBACK_BASE_URL: ${LLM_FINAL_FALLBACK_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_FINAL_FALLBACK_API_KEY: ${LLM_FINAL_FALLBACK_API_KEY:-}
      LLM_FINAL_FALLBACK_MODEL: ${LLM_FINAL_FALLBACK_MODEL:-GLM-5.3-Flash}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      model_reasoning_effort: ${model_reasoning_effort:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      TUTOR_PROVIDER_ENABLED: ${TUTOR_PROVIDER_ENABLED:-true}
      LLM_PROVIDER_ALLOW_PRIVATE_NETWORK: ${LLM_PROVIDER_ALLOW_PRIVATE_NETWORK:-false}
      LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST: ${LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST:-}
      FACTORY_PROVIDER_ENABLED: ${FACTORY_PROVIDER_ENABLED:-false}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-api}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_LOCAL_MODEL: ${EMBEDDING_LOCAL_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      RERANKER_MODE: ${RERANKER_MODE:-api}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-siliconflow}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-https://api.siliconflow.cn/v1}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      # User-uploaded Factory sources must be visible to the separate
      # Dramatiq worker.  A named volume keeps the job's durable database row
      # and its source file in the same local Docker lifecycle.
      - type: volume
        source: endotutor_factory_uploads
        target: /app/runtime/uploads
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ${ENDO_LOCAL_VQA_HOST_ROOT:-./data/vqa}
        target: /app/vqa-data
        read_only: true
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
      - type: volume
        source: endotutor_embedding_cache
        target: /app/runtime/fastembed
      - type: volume
        source: tiban_knowledge_data
        target: /app/runtime/knowledge
      # Instance-scoped Settings are runtime-only.  This small shared volume
      # lets the API and Dramatiq worker observe an applied provider/key while
      # keeping it outside PostgreSQL, browser state and the repository.
      - type: volume
        source: endotutor_runtime_state
        target: /app/runtime/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["dramatiq", "app.workers.factory_worker", "app.workers.background_worker"]
    environment:
      ENDO_DATABASE_URL: postgresql+psycopg://endotutor_dev:endotutor_dev_only@postgres:5432/endotutor_stage1
      ENDO_PROJECT_DATA_ROOT: /app/data
      ENDO_LOCAL_VQA_ROOT: /app/vqa-data
      ENDO_EMBEDDING_CACHE: /app/runtime/fastembed
      ENDO_KNOWLEDGE_UPLOAD_DIR: /app/runtime/knowledge
      FACTORY_EMBEDDING_PREWARM: "true"
      FACTORY_WORKER_READY_FILE: /tmp/factory-worker-ready
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Factory uses the same local-only provider configuration as the API.
      LLM_PROVIDER: ${LLM_PROVIDER:-cloudflare_workers_ai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-@cf/qwen/qwen3-30b-a3b-fp8}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openrouter}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-minimax/minimax-m3:free}
      LLM_FINAL_FALLBACK_PROVIDER: ${LLM_FINAL_FALLBACK_PROVIDER:-bigmodel}
      LLM_FINAL_FALLBACK_BASE_URL: ${LLM_FINAL_FALLBACK_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_FINAL_FALLBACK_API_KEY: ${LLM_FINAL_FALLBACK_API_KEY:-}
      LLM_FINAL_FALLBACK_MODEL: ${LLM_FINAL_FALLBACK_MODEL:-GLM-5.3-Flash}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      model_reasoning_effort: ${model_reasoning_effort:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      LLM_PROVIDER_ALLOW_PRIVATE_NETWORK: ${LLM_PROVIDER_ALLOW_PRIVATE_NETWORK:-false}
      LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST: ${LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST:-}
      FACTORY_PROVIDER_ENABLED: ${FACTORY_PROVIDER_ENABLED:-false}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-api}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_LOCAL_MODEL: ${EMBEDDING_LOCAL_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      RERANKER_MODE: ${RERANKER_MODE:-api}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-siliconflow}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-https://api.siliconflow.cn/v1}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      - type: volume
        source: endotutor_factory_uploads
        target: /app/runtime/uploads
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ${ENDO_LOCAL_VQA_HOST_ROOT:-./data/vqa}
        target: /app/vqa-data
        read_only: true
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
      - type: volume
        source: endotutor_embedding_cache
        target: /app/runtime/fastembed
      - type: volume
        source: tiban_knowledge_data
        target: /app/runtime/knowledge
      - type: volume
        source: endotutor_runtime_state
        target: /app/runtime/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/factory-worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  endotutor_postgres_data:
  endotutor_qdrant_data:
  endotutor_redis_data:
  endotutor_factory_uploads:
  endotutor_embedding_cache:
  endotutor_runtime_state:
  tiban_knowledge_data:
