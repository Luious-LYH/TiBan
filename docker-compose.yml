services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: endotutor_stage1
      POSTGRES_USER: endotutor_dev
      POSTGRES_PASSWORD: endotutor_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - endotutor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endotutor_dev -d endotutor_stage1"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - endotutor_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - endotutor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      ENDO_APP_ENV: demo
      ENDO_DEMO_QBANK_BOOTSTRAP: "false"
      ENDO_PROJECT_DATA_ROOT: /app/data
      ENDO_LOCAL_VQA_ROOT: /app/vqa-data
      ENDO_EMBEDDING_CACHE: /app/runtime/fastembed
      ENDO_DATABASE_URL: postgresql+psycopg://endotutor_dev:endotutor_dev_only@postgres:5432/endotutor_stage1
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      ENDO_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Read local provider configuration from the ignored root .env without
      # baking a gateway address or credential into the compose file.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-sol}
      model_reasoning_effort: ${model_reasoning_effort:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      TUTOR_PROVIDER_ENABLED: ${TUTOR_PROVIDER_ENABLED:-false}
      LLM_PROVIDER_ALLOW_PRIVATE_NETWORK: ${LLM_PROVIDER_ALLOW_PRIVATE_NETWORK:-false}
      LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST: ${LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST:-}
    volumes:
      # User-uploaded Factory sources must be visible to the separate
      # Dramatiq worker.  A named volume keeps the job's durable database row
      # and its source file in the same local Docker lifecycle.
      - type: volume
        source: endotutor_factory_uploads
        target: /app/runtime/uploads
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ${ENDO_LOCAL_VQA_HOST_ROOT:-./data/vqa}
        target: /app/vqa-data
        read_only: true
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
      - type: volume
        source: endotutor_embedding_cache
        target: /app/runtime/fastembed
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["dramatiq", "app.workers.factory_worker"]
    environment:
      ENDO_DATABASE_URL: postgresql+psycopg://endotutor_dev:endotutor_dev_only@postgres:5432/endotutor_stage1
      ENDO_PROJECT_DATA_ROOT: /app/data
      ENDO_LOCAL_VQA_ROOT: /app/vqa-data
      ENDO_EMBEDDING_CACHE: /app/runtime/fastembed
      FACTORY_EMBEDDING_PREWARM: "true"
      FACTORY_WORKER_READY_FILE: /tmp/factory-worker-ready
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Factory uses the same local-only provider configuration as the API.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-sol}
      model_reasoning_effort: ${model_reasoning_effort:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      LLM_PROVIDER_ALLOW_PRIVATE_NETWORK: ${LLM_PROVIDER_ALLOW_PRIVATE_NETWORK:-false}
      LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST: ${LLM_PROVIDER_PRIVATE_HOST_ALLOWLIST:-}
    volumes:
      - type: volume
        source: endotutor_factory_uploads
        target: /app/runtime/uploads
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ${ENDO_LOCAL_VQA_HOST_ROOT:-./data/vqa}
        target: /app/vqa-data
        read_only: true
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
      - type: volume
        source: endotutor_embedding_cache
        target: /app/runtime/fastembed
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/factory-worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  endotutor_postgres_data:
  endotutor_qdrant_data:
  endotutor_redis_data:
  endotutor_factory_uploads:
  endotutor_embedding_cache:
