# Isolated Phase E-C acceptance only.  Use with
# `docker compose -p tibanphaseecold -f docker-compose.yml -f compose.phase-e-cold-start.override.yml`.
# Every named volume receives the project prefix, so this never mutates the
# normal developer runtime or its FastEmbed cache.
services:
  postgres:
    ports: !override
      - "127.0.0.1:55433:5432"

  qdrant:
    ports: !override
      - "127.0.0.1:6334:6333"

  redis:
    ports: !override
      - "127.0.0.1:56380:6379"

  backend:
    environment:
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      FACTORY_PROVIDER_ENABLED: "false"
    ports: !override
      - "127.0.0.1:8011:8000"

  frontend:
    ports: !override
      - "127.0.0.1:5175:80"
