# Second isolated Phase E-C run after the prewarm lock hardening.  Use a
# separate project and separate ports/volumes; it never removes the first run.
services:
  postgres:
    ports: !override
      - "127.0.0.1:55434:5432"
  qdrant:
    ports: !override
      - "127.0.0.1:6335:6333"
  redis:
    ports: !override
      - "127.0.0.1:56381:6379"
  backend:
    environment:
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      FACTORY_PROVIDER_ENABLED: "false"
    ports: !override
      - "127.0.0.1:8012:8000"
  frontend:
    ports: !override
      - "127.0.0.1:5175:80"
