services:
  postgres:
    ports: !override
      - "127.0.0.1:55434:5432"
  qdrant:
    ports: !override
      - "127.0.0.1:6335:6333"
  redis:
    ports: !override
      - "127.0.0.1:56381:6379"
  backend:
    environment:
      ENDO_ALLOWED_ORIGINS: http://localhost:5176,http://127.0.0.1:5176
    ports: !override
      - "127.0.0.1:8004:8000"
  frontend:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8004
    ports: !override
      - "127.0.0.1:5176:80"

volumes:
  endotutor_postgres_data:
    name: tibanstage6_postgres_data
  endotutor_qdrant_data:
    name: tibanstage6_qdrant_data
  endotutor_redis_data:
    name: tibanstage6_redis_data
  endotutor_factory_uploads:
    name: tibanstage6_factory_uploads
