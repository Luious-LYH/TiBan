services:
  postgres:
    ports: !override
      - "127.0.0.1:55435:5432"
  qdrant:
    ports: !override
      - "127.0.0.1:6336:6333"
  redis:
    ports: !override
      - "127.0.0.1:56382:6379"
  backend:
    environment:
      ENDO_ALLOWED_ORIGINS: http://localhost:5177,http://127.0.0.1:5177
      # Acceptance must be provider-independent and reproducible even when a
      # developer shell exports a private provider configuration. The
      # deterministic local policy adapter still exercises the real Tutor
      # event/tool/source lifecycle; external-provider smoke is separate.
      TUTOR_PROVIDER_ENABLED: "false"
      LLM_PROVIDER_ALLOW_PRIVATE_NETWORK: "false"
      LLM_PROVIDER: "local_policy"
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: "deterministic-local"
    ports: !override
      - "127.0.0.1:8005:8000"
  worker:
    environment:
      LLM_PROVIDER_ALLOW_PRIVATE_NETWORK: "false"
      LLM_PROVIDER: "local_policy"
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: "deterministic-local"
  frontend:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8005
    ports: !override
      - "127.0.0.1:5177:80"
