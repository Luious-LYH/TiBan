server {
  listen 80;
  server_name _;
  # Factory currently sends Base64 JSON. A 5 MiB raw document expands to
  # roughly 6.7 MiB before request headers, so the default 1 MiB Nginx limit
  # produced a misleading 413 before FastAPI could return its real validation.
  client_max_body_size 8m;
  root /usr/share/nginx/html;
  index index.html;

  # Keep browser traffic on the Compose origin.  Tutor uses SSE, so proxy
  # buffering must remain disabled or streamed source/token events arrive as
  # one delayed response instead of a live learning interaction.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
